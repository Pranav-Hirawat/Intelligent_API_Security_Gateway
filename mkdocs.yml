site_name: Intelligent API Security Gateway
site_description: Engineering documentation for the Go-based API security gateway.
repo_name: Intelligent_API_Security_Gateway
docs_dir: gateway/docs

theme:
  name: material
  # A 1x1 transparent PNG. Material always emits a <link rel="icon">, so the
  # only way to have no favicon is to point it at an image with nothing in it.
  favicon: assets/blank-favicon.png
  features:
    - navigation.sections
    - navigation.expand
    - navigation.top
    - content.code.copy
  # Dark is the default: the first entry wins on a first visit, and the toggle
  # still gets you to light. Tying these to prefers-color-scheme instead would
  # hand the choice back to the operating system.
  palette:
    - scheme: slate
      primary: black
      accent: light blue
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
    - scheme: default
      primary: blue grey
      accent: blue
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - tables
  - toc:
      permalink: true
  # The custom fence is what turns a ```mermaid block into a diagram. Without
  # it superfences emits a plain <pre><code>, which is why every diagram on
  # this site used to render as its own source text.
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
# Material ships the Mermaid integration itself, including re-rendering the
# diagrams when the palette toggle is used, so there is no CDN tag and no
# hand-written renderer to keep working.
extra_css:
  - stylesheets/extra.css
nav:
  - Overview: index.md
  - Project Guide:
      - Context and Scope: project-context.md
      - Project Structure: project-structure.md
      - System Architecture: system-architecture.md
      - Request Lifecycle: request-lifecycle.md
  - Gateway Modules:
      - Gateway Overview: modules/proxy-module.md
      - Reverse Proxy and Body Safety: reverse-proxy-logic.md
      - Client IP Resolution: client-ip.md
      - Detection Signals: detection-signals.md
      - Enforcement and Ownership: modules/enforcement-ownership.md
      - Policy Enforcement: policy-enforcement.md
      - Redis and Telemetry: modules/redis-telemetry.md
      - Network-Level Blocking: network-level-blocking.md
  - Decision Engine Modules:
      - Decision Engine: decision-engine.md
      - Adaptive Policy: adaptive-policy.md
      - The 17 Algorithms: modules/algorithms.md
  - Dashboard and Testing:
      - Dashboard: modules/dashboard.md
      - Signal Test Scripts: modules/signal-tests.md
  - Operations:
      - Run Locally: running-locally.md
      - Run with Docker: running-with-docker.md
      - Protect Your Own API: protecting-your-own-api.md
