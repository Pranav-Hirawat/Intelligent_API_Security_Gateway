# Runs on every pull request, so a change is checked before it reaches main
# rather than when someone next cuts a release.
#
# The four lanes are independent on purpose: a broken dashboard build should not
# hide a passing gateway, and each reports separately.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# A second push to the same branch makes the first run irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gateway:
    name: Go gateway
    runs-on: ubuntu-latest

    # The settings watcher, the telemetry store and the policy store are what
    # talk to Redis, and a fake cannot tell us they write what the console and
    # control plane read. Each test package uses its own database number.
    services:
      redis:
        image: redis:8.6
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v5
        with:
          # Read from go.mod so this cannot drift from what the module declares.
          go-version-file: gateway/go.mod
          cache-dependency-path: gateway/go.sum

      - name: Vet
        working-directory: gateway
        run: go vet ./...

      - name: Test
        working-directory: gateway
        # Without this the Redis-backed tests skip. Every other test stands up
        # its own fixtures and still passes with no Redis at all.
        env:
          IASG_TEST_REDIS_ADDR: localhost:6379
        run: go test ./...

  control-plane:
    name: Python control plane
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18.2
        env:
          POSTGRES_USER: iasg_user
          POSTGRES_PASSWORD: changeme
          POSTGRES_DB: iasg_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U iasg_user -d iasg_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:8.6
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        working-directory: control-plane
        run: pip install -e ".[dev,ml,postgres]"

      - name: Test
        working-directory: control-plane
        env:
          # Without this the sixteen Postgres tests skip. They are the ones
          # least likely to be run by hand, which is the argument for running
          # them here. The schema creates itself on connect.
          IASG_TEST_POSTGRES_URL: postgresql://iasg_user:changeme@localhost:5432/iasg_test
          # The store contract runs MemoryStore and RedisStore through the same
          # properties; without this only the in-memory half runs.
          IASG_TEST_REDIS_URL: redis://localhost:6379/13
        run: python -m pytest -q

  dashboard:
    name: Dashboard
    runs-on: ubuntu-latest

    # The API route tests call the real handlers against these.
    services:
      redis:
        image: redis:8.6
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      postgres:
        image: postgres:18.2
        env:
          POSTGRES_USER: iasg_user
          POSTGRES_PASSWORD: changeme
          POSTGRES_DB: iasg_dash
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U iasg_user -d iasg_dash"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: gateway-dashboard/package-lock.json

      - name: Install
        working-directory: gateway-dashboard
        run: npm ci

      - name: Test
        working-directory: gateway-dashboard
        env:
          IASG_TEST_DASHBOARD_REDIS: localhost:6379
          IASG_TEST_POSTGRES_URL: postgresql://iasg_user:changeme@localhost:5432/iasg_dash
        run: npm test

      - name: Build
        working-directory: gateway-dashboard
        # The release cannot succeed if this fails, so it is worth knowing on
        # the pull request rather than on the tag.
        run: npm run build

  images:
    name: Image (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: gateway
            context: gateway
            file: gateway/Dockerfile
          - name: control-plane
            context: .
            file: control-plane/Dockerfile
          - name: dashboard
            context: gateway-dashboard
            file: gateway-dashboard/Dockerfile
          - name: vulnerable-api
            context: vulnerable-app/backend
            file: vulnerable-app/backend/Dockerfile
          - name: vulnerable-web
            context: vulnerable-app
            file: vulnerable-app/Dockerfile

    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          # Single platform and no push: this asks whether the Dockerfile still
          # builds, which is all a pull request needs to know. The release
          # workflow owns producing the multi-architecture images.
          platforms: linux/amd64
          push: false
          cache-from: type=gha,scope=ci-${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=ci-${{ matrix.name }},ignore-error=true

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -r gateway/docs/requirements.txt

      - name: Build
        # --strict turns a broken cross-reference into a failure. The docs are
        # treated as code here, so a link this change breaks is caught now.
        run: mkdocs build --strict
