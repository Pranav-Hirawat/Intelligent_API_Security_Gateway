<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'">
  <title>IASG</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f6f7f9; --panel: #ffffff; --text: #16181d; --muted: #5d6470;
      --border: #dde1e7; --accent: #2f6fed; --bad: #c73a3a; --good: #1f8a4c;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0f1115; --panel: #171a21; --text: #e7e9ee; --muted: #9aa2b1;
        --border: #2a2f3a; --accent: #6b9bff; --bad: #ff6b6b; --good: #4fc987;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      background: var(--bg); color: var(--text);
      font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      padding: 24px;
    }
    main {
      width: min(760px, 100%); background: var(--panel);
      border: 1px solid var(--border); border-radius: 12px; padding: 28px;
    }
    h1 { margin: 0; font-size: 20px; }
    /* The dashboard's mark (gateway-dashboard/app/icon.svg). */
    .brand { display: flex; align-items: center; gap: 10px; margin: 0 0 4px; }
    .logo { display: grid; place-items: center; width: 24px; height: 24px; flex: none; background: #8b6cf2; }
    .logo-dot { width: 9px; height: 9px; background: #0e0e11; }
    .sub { margin: 0 0 20px; color: var(--muted); }
    .status { display: flex; gap: 12px; align-items: center; font-size: 15px; }
    .dot {
      width: 10px; height: 10px; border-radius: 50%; flex: none;
      background: var(--accent); animation: pulse 1.2s ease-in-out infinite;
    }
    .status[data-tone="bad"] .dot { background: var(--bad); animation: none; }
    .status[data-tone="good"] .dot { background: var(--good); animation: none; }
    @keyframes pulse { 50% { opacity: 0.3; } }
    .actions { display: flex; gap: 8px; margin: 18px 0; flex-wrap: wrap; }
    button {
      font: inherit; padding: 7px 14px; border-radius: 8px; cursor: pointer;
      border: 1px solid var(--border); background: var(--panel); color: var(--text);
    }
    button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
    details summary { cursor: pointer; color: var(--muted); }
    .setup {
      margin: 18px 0 4px; padding: 16px 18px; border: 1px solid var(--border);
      border-radius: 10px; background: var(--bg);
    }
    .setup h2 { margin: 0 0 6px; font-size: 15px; }
    .setup .note { margin: 0 0 10px; color: var(--muted); }
    .setup ol { margin: 0; padding-left: 22px; display: grid; gap: 6px; }
    .setup ol button { margin-left: 6px; padding: 3px 10px; font-size: 13px; }
    .setup .waiting { margin: 12px 0 0; color: var(--muted); }
    .setup details { margin-top: 12px; }
    .setup details ul { margin: 8px 0 0; padding-left: 20px; display: grid; gap: 6px; }
    .setup .links { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
    code {
      font: 12px ui-monospace, SFMono-Regular, Menlo, monospace; padding: 1px 5px;
      border-radius: 4px; background: var(--panel); border: 1px solid var(--border);
    }
    pre {
      margin: 10px 0 0; max-height: 320px; overflow: auto; padding: 12px;
      background: var(--bg); border: 1px solid var(--border); border-radius: 8px;
      font: 12px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace; white-space: pre-wrap;
    }
  </style>
</head>
<body>
  <main>
    <div class="brand">
      <span class="logo" aria-hidden="true"><span class="logo-dot"></span></span>
      <h1>Intelligent API Security Gateway</h1>
    </div>
    <p class="sub">Runs the gateway, decision engine, dashboard and demo app in Docker.</p>

    <div class="status" id="status"><span class="dot"></span><span id="message">Starting…</span></div>

    <section class="setup" id="setup" hidden></section>

    <div class="actions">
      <button class="primary" id="retry" hidden>Retry</button>
      <button class="primary" id="dashboard" hidden>Open Dashboard</button>
    </div>

    <details id="details">
      <summary>Details</summary>
      <pre id="log"></pre>
    </details>
  </main>
  <script src="status.js"></script>
</body>
</html>
