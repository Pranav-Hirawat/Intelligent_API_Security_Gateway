services:
  ports_info:
    image: alpine:3.21
    restart: "no"
    command:
      - /bin/sh
      - -c
      - |
        echo "Port map:" &&
        echo "- Gateway API:          http://localhost:8082" &&
        echo "- Vulnerable API:       http://localhost:5002" &&
        echo "- Gateway Dashboard:    http://localhost:5177" &&
        echo "- Vulnerable Web:       http://localhost:5175" &&
        echo "- MkDocs:               http://localhost:8000" &&
        echo "- Postgres (Gateway):   localhost:5434" &&
        echo "- Postgres (Vuln API):  localhost:5435" &&
        echo "- Redis:                localhost:6379" &&
        echo "- Decision engine:        python agent (no HTTP port)"

  postgres:
    image: postgres:18.2
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-iasg_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: ${POSTGRES_DB:-iasg}
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-iasg_user} -d ${POSTGRES_DB:-iasg}"]
      interval: 10s
      timeout: 5s
      retries: 5

  vulnerable_postgres:
    image: postgres:18.2
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      POSTGRES_USER: ${VULN_POSTGRES_USER:-vuln_user}
      POSTGRES_PASSWORD: ${VULN_POSTGRES_PASSWORD:-vuln_changeme}
      POSTGRES_DB: ${VULN_POSTGRES_DB:-vuln_app}

    ports:
      - "5435:5432"
    volumes:
      - vulnerable_postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${VULN_POSTGRES_USER:-vuln_user} -d ${VULN_POSTGRES_DB:-vuln_app}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8.6
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Narration model, opt-in via `docker compose --profile llm up`. A plain
  # `docker compose up` never touches this -- nothing downloads, nothing runs.
  # CPU-only here: Docker Desktop cannot pass the Apple Silicon GPU to a Linux
  # container, so this is several times slower than a native
  # `brew install ollama`. It exists so narration works with no host install
  # at all; run Ollama natively instead when speed matters (see the
  # decision_engine narration comment below).
  ollama:
    profiles: ["llm"]
    image: ollama/ollama:0.12.3
    restart: unless-stopped
    # Internal by default -- the decision engine reaches this by service name.
    # Uncomment to call /api/generate from the host directly.
    # ports:
    #   - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama
    healthcheck:
      # The image ships neither curl nor wget, so the CLI is the only probe
      # available. `list` talks to the local server and fails while it is
      # still starting, which is exactly the signal wanted here.
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 5

  # One-shot: makes sure the configured model is in ollama_models, then exits.
  # `show` first so a volume that already has the model succeeds offline, with
  # no registry round-trip -- a bare `pull` would contact the registry on
  # every start and fail this gate when offline.
  ollama_pull:
    profiles: ["llm"]
    image: ollama/ollama:0.12.3
    restart: "no"
    environment:
      OLLAMA_HOST: http://ollama:11434
    # A single quoted string, not a list -- Compose word-splits an unquoted
    # command the way a shell would, so wrapping the whole script in one pair
    # of quotes is what keeps `sh -c` from seeing the redirect and `||` as
    # separate, unrelated arguments.
    command: >-
      sh -c 'ollama show "${IASG_OLLAMA_MODEL:-llama3.2}" >/dev/null 2>&1 ||
      ollama pull "${IASG_OLLAMA_MODEL:-llama3.2}"'
    depends_on:
      ollama:
        condition: service_healthy

  vulnerable_api:
    image: node:22-alpine
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ../vulnerable-app/backend:/app
      - vulnerable_api_node_modules:/app/node_modules
    environment:
      PORT: 5002
      # Signs login tokens. The gateway verifies them with the same value
      # (identity.jwt); change both together. The default is a public demo value.
      IASG_JWT_SECRET: ${IASG_JWT_SECRET:-iasg-demo-jwt-secret-change-me}
      PGHOST: vulnerable_postgres
      PGPORT: 5432
      PGUSER: ${VULN_POSTGRES_USER:-vuln_user}
      PGPASSWORD: ${VULN_POSTGRES_PASSWORD:-vuln_changeme}
      PGDATABASE: ${VULN_POSTGRES_DB:-vuln_app}
    command: sh -c "npm ci && npm start"
    ports:
      - "5002:5002"
    depends_on:
      vulnerable_postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  gateway_dashboard:
    image: node:22-alpine
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ../gateway-dashboard:/app
      - gateway_dashboard_node_modules:/app/node_modules
      # Keep Next's Linux build cache out of the bind mount. A cache generated
      # on the Windows host can otherwise leave the container referencing
      # chunks that do not exist there after an edit or rebuild.
      - gateway_dashboard_next:/app/.next
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      # Live panels read Redis; the campaign history reads the record.
      IASG_POSTGRES_URL: postgresql://${POSTGRES_USER:-iasg_user}:${POSTGRES_PASSWORD:-changeme}@postgres:5432/${POSTGRES_DB:-iasg}
    # `.next` is a mounted volume, so clear its contents rather than trying
    # to remove the mount point itself.
    command: sh -c "find .next -mindepth 1 -delete && npm ci && npm run dev"
    ports:
      - "5177:5177"
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      gateway:
        condition: service_started

  vulnerable_web:
    image: node:22-alpine
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ../vulnerable-app:/app
      - vulnerable_web_node_modules:/app/node_modules
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0 --port 5175"
    ports:
      - "5175:5175"
    depends_on:
      - vulnerable_api

  gateway:
    image: golang:1.23-alpine
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ../gateway:/app
    environment:
      IASG_CONFIG: ${IASG_CONFIG:-configs/config.yaml}
      IASG_BACKEND_URL: http://vulnerable_api:5002
      IASG_REDIS_HOST: redis
      IASG_JWT_SECRET: ${IASG_JWT_SECRET:-iasg-demo-jwt-secret-change-me}
    command: sh -c "go run ./cmd/server"
    ports:
      - "8082:8082"
    depends_on:
      vulnerable_api:
        condition: service_started
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  decision_engine:
    image: python:3.12-slim
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ../decision-engine:/app
    environment:
      # Without this Python block-buffers stdout when it is not a TTY, so the
      # agent's per-cycle reasoning never reaches `docker compose logs` and the
      # decision engine looks dead even while it is writing campaigns.
      PYTHONUNBUFFERED: "1"
      IASG_REDIS_URL: redis://redis:6379/0
      IASG_EVIDENCE_STREAM: iasg:events
      IASG_DRY_RUN: "false"
      # Narration. The explanation and assessment agents write the prose the
      # console shows; without a provider the first falls back to a template
      # and the second produces nothing at all.
      #
      # Off by default -- IASG_LLM_PROVIDER stays "null" so a plain
      # `docker compose up` downloads and runs nothing extra. Opt in with two
      # steps: `docker compose --profile llm up -d` to start the `ollama`
      # service (see its definition above) and pull the model, then set
      # IASG_LLM_PROVIDER=ollama in infra/.env. IASG_OLLAMA_URL then points at
      # that container by service name.
      #
      # For real speed, skip the container and run Ollama natively instead
      # (`brew install ollama && ollama pull llama3.2`): on Apple Silicon the
      # native app reaches the GPU, where the containerised path (CPU-only --
      # Docker Desktop cannot pass the GPU to a Linux container) cannot. Point
      # at it with IASG_OLLAMA_URL=http://host.docker.internal:11434 in
      # infra/.env; `extra_hosts` below makes that name resolve on Linux too,
      # where it is not built in. One platform difference: Docker Desktop
      # proxies that name to the host's loopback, so an Ollama listening only
      # on 127.0.0.1 is reachable, while native Linux Docker routes to the
      # bridge address instead -- run Ollama with OLLAMA_HOST=0.0.0.0 there.
      #
      # A provider that is configured but unreachable is not an error either --
      # every call degrades to the template and says so once, in this
      # container's own logs (`grep '[llm]'`).
      #
      # CPU inference is slow enough at the 3b default that the timeout and
      # per-cycle budget need real headroom over the code's own 15s/12s
      # defaults -- keep the budget under IASG_INTERVAL_SECONDS (30s), which
      # is the whole point of having one.
      IASG_LLM_PROVIDER: ${IASG_LLM_PROVIDER:-null}
      IASG_OLLAMA_URL: ${IASG_OLLAMA_URL:-http://ollama:11434}
      IASG_OLLAMA_MODEL: ${IASG_OLLAMA_MODEL:-llama3.2}
      IASG_OLLAMA_TIMEOUT_SECONDS: ${IASG_OLLAMA_TIMEOUT_SECONDS:-30}
      IASG_NARRATION_BUDGET_SECONDS: ${IASG_NARRATION_BUDGET_SECONDS:-25}
      # Campaigns and feedback outlive a restart. Policy keys stay in Redis.
      IASG_POSTGRES_URL: postgresql://${POSTGRES_USER:-iasg_user}:${POSTGRES_PASSWORD:-changeme}@postgres:5432/${POSTGRES_DB:-iasg}
      IASG_HEALTH_STREAM: iasg:telemetry:health
    command: sh -c "pip install --no-cache-dir -e '.[postgres]' && PYTHONPATH=/app python -m iasg"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      gateway:
        condition: service_started

  docs:
    image: python:3.12-alpine
    restart: unless-stopped
    # mkdocs.yml lives at the repository root and points docs_dir at
    # gateway/docs, so the build has to run from the root. Running it from
    # gateway/ picked up a second, stale config that shipped a different
    # theme and referenced a renderer that no longer exists.
    working_dir: /workspace
    volumes:
      - ..:/workspace
    command: sh -c "pip install --no-cache-dir -r gateway/docs/requirements.txt && mkdocs serve -a 0.0.0.0:8000"
    ports:
      - "8000:8000"

volumes:
  postgres_data:
  vulnerable_postgres_data:
  redis_data:
  vulnerable_api_node_modules:
  gateway_dashboard_node_modules:
  gateway_dashboard_next:
  vulnerable_web_node_modules:
  ollama_models:
